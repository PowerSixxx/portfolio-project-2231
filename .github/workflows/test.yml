name: Java Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Download libraries
        run: |
          mkdir -p lib
          curl -fL --retry 3 -o lib/components.jar https://cse22x1.engineering.osu.edu/common/components.jar
          curl -fL --retry 3 -o lib/junit-4.13.2.jar https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fL --retry 3 -o lib/hamcrest-core-1.3.jar https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile
        run: |
          mkdir -p bin
          javac -cp "lib/*" -d bin \
            src/components/waitingline/*.java \
            src/*Demo.java \
            test/components/waitingline/*.java

      - name: Run tests
        run: |
          java -ea -cp "bin:lib/*" org.junit.runner.JUnitCore \
            components.waitingline.WaitingLine1Test \
            components.waitingline.WaitingLineTest